# ESP32-S3-BOX-3 Internet Radio
# ESP-IDF + ESP-GMF audio pipeline, Winamp 2 display, BT speaker bridge

esphome:
  name: esp32radio
  friendly_name: "ESP32 Radio"
  min_version: 2026.5.0
  platformio_options:
    build_flags:
      - -O2
      - -DBOARD_HAS_PSRAM

esp32:
  board: esp32s3box
  # ESPHome 2026.7+ defaults to the native ESP-IDF toolchain. Keep PlatformIO
  # for the ESP-GMF pre-build patch and the build path validated on this board.
  toolchain: platformio
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # ESP-GMF: disable built-in HTTP IO (we register our own with cert bundle)
      CONFIG_ESP_AUDIO_SIMPLE_PLAYER_HTTP_EN: "n"
      # Disable resampler (we handle sample rate via I2S reconfig)
      CONFIG_ESP_AUDIO_SIMPLE_PLAYER_RESAMPLE_EN: "n"
      # Disable file/flash IO (not needed)
      CONFIG_ESP_AUDIO_SIMPLE_PLAYER_FILE_EN: "n"
      CONFIG_ESP_AUDIO_SIMPLE_PLAYER_EMBED_FLASH_EN: "n"
      # Enable TLS cert bundle for HTTPS streams
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components:
      - internet_radio
      - winamp_display
      - i2s_bridge
      - box3_mic

logger:
  level: DEBUG

api:
  # 2026.5.x lowered the ESP32 default from 8 to 5; keep the old headroom explicit.
  max_connections: 8
  encryption:
    key: !secret esp32radio_api_key
  actions:
    # Debug helpers: preview a voice screen state / stream the screen as base64 logs
    - action: preview_voice
      variables:
        state: int
        heard: string
        reply: string
        mic_peak: int
      then:
        - lambda: |-
            esphome::internet_radio::voice_logic::g_mic_peak = mic_peak;
            id(display).set_voice_state(state);
            id(display).set_voice_text(heard.c_str());
            id(display).set_voice_reply(reply.c_str());
    - action: screenshot
      then:
        - lambda: id(display).dump_screenshot();

ota:
  # 2026.5.x requires OTA to stay a single entry.
  - platform: esphome
    password: !secret esp32radio_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Disable modem-sleep: LIGHT power-save (ESPHome default) causes periodic
  # WiFi wake latency that produces intermittent audio glitches when streaming
  # from high-RTT (e.g. US) servers. NONE keeps the radio always-on for steady
  # packet delivery — required for gap-free internet radio.
  power_save_mode: none

i2c:
  sda: GPIO8
  scl: GPIO18
  scan: false

# ES8311 codec — configured in internet_radio setup() via esp_codec_dev

# --- Custom Components ---

media_player:
  - platform: internet_radio
    id: radio
    name: "ESP32 Radio"
    # I2S0 pins (to ES8311 codec)
    i2s_bclk_pin: 17
    i2s_lrclk_pin: 45
    i2s_dout_pin: 15
    i2s_din_pin: 16  # ES7210 mic data (shared I2S0, duplex)
    i2s_mclk_pin: 2
    # Power amplifier enable
    pa_pin: 46
    # Default volume (0-21)
    default_volume: 15
    # HA entity references (publish-on-change from C++)
    now_playing_id: now_playing
    station_select_id: station_select

switch:
  - platform: i2s_bridge
    id: bt_speaker
    name: "BT Speaker"
    restore_mode: RESTORE_DEFAULT_OFF
    bclk_pin: 10
    lrck_pin: 14
    dout_pin: 11
    pa_pin: 46

  - platform: template
    name: "Wake Word"
    id: wake_word_enabled
    icon: "mdi:account-voice"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# --- Winamp 2 Display ---

winamp_display:
  id: display
  radio_id: radio
  bridge_id: bt_speaker
  brightness: 160
  brightness_number_id: screen_brightness
  # Round touch button below the screen starts the assistant (or stops it if running)
  on_home_button:
    - if:
        condition: voice_assistant.is_running
        then:
          - voice_assistant.stop:
        else:
          # Show the voice screen immediately; the pipeline takes a moment to start
          - lambda: |-
              id(display).set_voice_state(1);
          - micro_wake_word.stop:
          - voice_assistant.start:

# --- Hardware Buttons ---

binary_sensor:
  - platform: gpio
    name: "Boot Button"
    id: boot_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true  # active LOW
    internal: true
    on_press:
      - lambda: id(display).cycle_brightness();

# --- Voice assistant (button-triggered; mic shares I2S0 with the radio) ---

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: box3_mic
    id: box3_microphone
    channel: left
  # Second instance for wake word: listens while the radio plays (resampled to 16 kHz)
  - platform: box3_mic
    id: box3_wake_microphone
    channel: left
    wake_mode: true

micro_wake_word:
  id: mww
  microphone:
    microphone: box3_wake_microphone
    gain_factor: 4
  stop_after_detection: true
  models:
    - model: okay_nabu
      probability_cutoff: 0.9
  on_wake_word_detected:
    - lambda: |-
        ESP_LOGI("wake", "Wake word detected");
        id(display).set_voice_state(1);
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone:
    microphone: box3_microphone
    gain_factor: 4
  media_player: radio
  on_start:
    - lambda: |-
        id(display).set_voice_state(1);
        id(voice_state_text).publish_state("starting");
  on_listening:
    - lambda: |-
        id(radio).play_voice_cue(false);
        id(display).set_voice_state(2);
        id(voice_state_text).publish_state("listening");
        id(voice_heard_text).publish_state("");
        id(voice_reply_text).publish_state("");
  on_stt_end:
    # x = recognized speech
    - lambda: |-
        id(display).set_voice_state(3);
        id(display).set_voice_text(x.c_str());
        id(voice_state_text).publish_state("thinking");
        id(voice_heard_text).publish_state(x);
  on_tts_start:
    # x = assistant's reply text
    - lambda: |-
        id(voice_reply_text).publish_state(x);
  on_tts_end:
    - lambda: |-
        id(display).set_voice_state(4);
        id(display).set_voice_reply(id(voice_reply_text).state.c_str());
        id(voice_state_text).publish_state("replying");
  on_end:
    # Wait for the TTS reply to finish, then bring the station back
    - wait_until:
        condition:
          not:
            media_player.is_announcing: radio
        timeout: 30s
    # Let a follow-up question (continue_conversation) re-enter the assistant first
    - delay: 300ms
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - lambda: |-
              id(radio).voice_session_end();
              if (!id(display).voice_is_error()) {
                id(display).set_voice_state(0);
                id(voice_state_text).publish_state("idle");
              }
  on_error:
    - lambda: |-
        id(radio).play_voice_cue(true);
        id(radio).voice_session_end();
        id(display).set_voice_state(5);
        id(display).set_voice_reply(message.c_str());
        id(voice_state_text).publish_state("error");

interval:
  # Keep the wake word detector running whenever no voice session is active
  - interval: 1s
    then:
      - lambda: |-
          bool want = id(wake_word_enabled).state && !id(va).is_running() &&
                      !id(radio).is_voice_active() && !id(radio).is_announcing();
          if (want && !id(mww).is_running()) id(mww).start();
          if (!id(wake_word_enabled).state && id(mww).is_running()) id(mww).stop();
  # Safety net: never leave the radio stopped if a voice session ended without on_end
  - interval: 2s
    then:
      - lambda: |-
          if (!id(va).is_running() && id(radio).is_voice_active() && !id(radio).is_announcing())
            id(radio).voice_session_end();

# --- HA Entities (song title, station picker, controls) ---

button:
  - platform: template
    name: "Ask Assistant"
    icon: "mdi:microphone"
    on_press:
      - lambda: |-
          id(display).set_voice_state(1);
      - micro_wake_word.stop:
      - voice_assistant.start:

  - platform: template
    name: "Next Station"
    icon: "mdi:skip-next"
    on_press:
      - lambda: id(radio).next_station_();

  - platform: template
    name: "Previous Station"
    icon: "mdi:skip-previous"
    on_press:
      - lambda: id(radio).prev_station_();

text_sensor:
  # Voice assistant status + conversation trace (also visible in HA Assist debug)
  - platform: template
    name: "Voice Assistant State"
    id: voice_state_text
    icon: "mdi:microphone"
  - platform: template
    name: "Voice Heard"
    id: voice_heard_text
    icon: "mdi:text-recognition"
  - platform: template
    name: "Voice Reply"
    id: voice_reply_text
    icon: "mdi:comment-text"
  - platform: template
    name: "Now Playing"
    id: now_playing
    icon: "mdi:music-note"
    update_interval: never

select:
  - platform: template
    name: "Station"
    id: station_select
    icon: "mdi:radio"
    options:
      - "Groove Salad"
      - "Enigmatic Station 1"
      - "Psytrance"
      - "Rock Antenne"
      - "181 Hard Rock"
      - "KEXP 90.3 Seattle"
      - "181 Power Hits"
      - "KROQ"
      - "BBC World News"
      - "NPR News"
    set_action:
      - lambda: |-
          const auto &opts = id(station_select).traits.get_options();
          for (int i = 0; i < (int)opts.size(); i++) {
            if (opts[i] == x) {
              id(radio).set_station(i);
              break;
            }
          }
    update_interval: never

number:
  - platform: template
    name: "Screen Brightness"
    id: screen_brightness
    icon: "mdi:brightness-6"
    min_value: 1
    max_value: 255
    step: 1
    set_action:
      - lambda: id(display).set_brightness((int)x);
    update_interval: never
